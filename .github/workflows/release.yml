name: Package release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Check tag and version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert os.environ['RELEASE_TAG'] == 'v' + Path('VERSION').read_text().strip(), 'Release tag must match VERSION'
          PY
      - run: make test
      - run: make package
      - name: Verify universal executables
        run: |
          lipo -info build/CompanionHover.app/Contents/MacOS/CompanionHover
          lipo -info build/CompanionHover.app/Contents/Resources/CompanionWatch
          cd dist
          shasum -a 256 -c SHA256SUMS
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS
